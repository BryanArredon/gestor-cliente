version: "3.8"

# Red compartida Jenkins <-> SonarQube
networks:
  devsecops-net:
    driver: bridge

services:
  # ---------------------------------------------------------------
  # Jenkins LTS con JDK 21 + Maven 3.9.9 + Semgrep (SAST)
  # ---------------------------------------------------------------
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins-jdk21
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"   # Consola web de Jenkins
      - "50000:50000" # Agentes JNLP
    volumes:
      - jenkins_home:/var/jenkins_home
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    networks:
      - devsecops-net

  # ---------------------------------------------------------------
  # SonarQube Community para análisis de calidad + cobertura
  # ---------------------------------------------------------------
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"   # Consola web de SonarQube
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    networks:
      - devsecops-net

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
