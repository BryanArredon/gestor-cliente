# =============================================================================
# Configuracion del analisis SonarQube para Ejercicio5Cliente
# Se lee automaticamente por sonar-maven-plugin (mvn sonar:sonar)
# =============================================================================

# Identidad del proyecto en SonarQube (dashboard)
sonar.projectKey=com.mx.cbtis.cliente
sonar.projectName=Ejercicio5Cliente
sonar.projectVersion=1.0

# Codigo fuente y pruebas
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/target/**,**/*.md,**/*.html,**/*.css,**/*.js

# Analisis de Java
sonar.java.binaries=target/classes
sonar.java.source=21
sonar.java.vendor=openjdk

# Reportes de pruebas unitarias (Surefire)
sonar.junit.reportPaths=target/surefire-reports

# Reporte de cobertura JaCoCo (generado en la etapa de build)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Reportes de OWASP Dependency-Check importados al dashboard
sonar.dependencyCheck.jsonReportPath=target/dependency-check-report.json
sonar.dependencyCheck.htmlReportPath=target/dependency-check-report.html

